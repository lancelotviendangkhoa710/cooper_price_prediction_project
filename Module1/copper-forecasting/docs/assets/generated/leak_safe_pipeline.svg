<svg xmlns='http://www.w3.org/2000/svg' width='1120' height='350' viewBox='0 0 1120 350' role='img' aria-labelledby='t d'><title id='t'>Leak-safe copper forecasting protocol</title><desc id='d'>Code-faithful flow from chronological data through split, scaling, windowing, targets, models and evaluation.</desc>
<defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#35495e'/></marker></defs><style>.title{font:600 20px sans-serif}.h{font:600 14px sans-serif}.p{font:12px sans-serif}.box{fill:#f6f8fb;stroke:#49657a;stroke-width:1.5}.arrow{stroke:#35495e;stroke-width:2;marker-end:url(#a)}</style><rect width='100%' height='100%' fill='white'/><text x='560' y='30' text-anchor='middle' class='title'>Leak-safe experimental pipeline implemented in V20-V25</text>
<g transform='translate(25,75)'><rect fill='#f6f8fb' stroke='#49657a' stroke-width='1.5' width='145' height='115' rx='9'/><text x='72' y='25' text-anchor='middle' class='h'>Chronological data</text><text x='12' y='50' class='p'>Target: Copper(t)</text><text x='12' y='70' class='p'>Feature order locked</text><text x='12' y='90' class='p'>No shuffle</text></g>
<line stroke='#35495e' stroke-width='2' marker-end='url(#a)' x1='170' y1='132' x2='205' y2='132'/><g transform='translate(210,75)'><rect fill='#f6f8fb' stroke='#49657a' stroke-width='1.5' width='155' height='115' rx='9'/><text x='77' y='25' text-anchor='middle' class='h'>Time split</text><text x='12' y='50' class='p'>Train | validation | test</text><text x='12' y='70' class='p'>80/20, 90/10,</text><text x='12' y='90' class='p'>92.5/7.5, 95/5</text></g>
<line stroke='#35495e' stroke-width='2' marker-end='url(#a)' x1='365' y1='132' x2='400' y2='132'/><g transform='translate(405,75)'><rect fill='#f6f8fb' stroke='#49657a' stroke-width='1.5' width='155' height='115' rx='9'/><text x='77' y='25' text-anchor='middle' class='h'>Train-only scaling</text><text x='12' y='50' class='p'>MinMaxScaler X and y</text><text x='12' y='70' class='p'>fit before validation</text><text x='12' y='90' class='p'>reuse on test</text></g>
<line stroke='#35495e' stroke-width='2' marker-end='url(#a)' x1='560' y1='132' x2='595' y2='132'/><g transform='translate(600,75)'><rect fill='#f6f8fb' stroke='#49657a' stroke-width='1.5' width='155' height='115' rx='9'/><text x='77' y='25' text-anchor='middle' class='h'>Sliding windows</text><text x='12' y='50' class='p'>X: (N, 22, F)</text><text x='12' y='70' class='p'>Horizon = 1</text><text x='12' y='90' class='p'>inputs end at t-1</text></g>
<line stroke='#35495e' stroke-width='2' marker-end='url(#a)' x1='755' y1='132' x2='790' y2='132'/><g transform='translate(795,55)'><rect fill='#f6f8fb' stroke='#49657a' stroke-width='1.5' width='140' height='75' rx='9'/><text x='70' y='25' text-anchor='middle' class='h'>Direct target</text><text x='70' y='50' text-anchor='middle' class='p'>Copper(t)</text><rect fill='#f6f8fb' stroke='#49657a' stroke-width='1.5' y='105' width='140' height='75' rx='9'/><text x='70' y='130' text-anchor='middle' class='h'>Residual target</text><text x='70' y='155' text-anchor='middle' class='p'>Copper(t)-Copper(t-1)</text></g>
<line stroke='#35495e' stroke-width='2' marker-end='url(#a)' x1='935' y1='92' x2='970' y2='92'/><line stroke='#35495e' stroke-width='2' marker-end='url(#a)' x1='935' y1='197' x2='970' y2='197'/><g transform='translate(975,75)'><rect fill='#f6f8fb' stroke='#49657a' stroke-width='1.5' width='120' height='115' rx='9'/><text x='60' y='25' text-anchor='middle' class='h'>Fit / predict</text><text x='10' y='50' class='p'>validation ES</text><text x='10' y='70' class='p'>inverse scale</text><text x='10' y='90' class='p'>residual + prev</text></g>
<g transform='translate(310,250)'><rect fill='#f6f8fb' stroke='#49657a' stroke-width='1.5' width='500' height='65' rx='9'/><text x='250' y='24' text-anchor='middle' class='h'>Evaluation in original price units</text><text x='250' y='47' text-anchor='middle' class='p'>MAE, RMSE, MAPE, R2, directional accuracy; Naive = Copper(t-1); paired DM-HAC where aligned</text></g>
<line stroke='#35495e' stroke-width='2' marker-end='url(#a)' x1='1035' y1='190' x2='810' y2='276'/></svg>