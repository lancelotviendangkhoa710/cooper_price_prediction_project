<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='330' viewBox='0 0 1080 330' role='img' aria-labelledby='t d'><title id='t'>Fresh simulated annealing protocol</title><desc id='d'>Code-faithful SA hyperparameter flow from V22 cell 12.</desc><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#34495e'/></marker></defs><style>.title{font:600 20px sans-serif}.h{font:600 14px sans-serif}.p{font:12px sans-serif}.box{fill:#fffaf3;stroke:#a46a1f;stroke-width:1.5}.arrow{stroke:#34495e;stroke-width:2;marker-end:url(#a)}</style><rect width='100%' height='100%' fill='white'/><text x='540' y='30' text-anchor='middle' class='title'>Fresh SA tunes hyperparameters - not neural weights (V22)</text>
<g transform='translate(25,80)'><rect fill='#fffaf3' stroke='#a46a1f' stroke-width='1.5' width='175' height='125' rx='9'/><text x='87' y='25' text-anchor='middle' class='h'>Start / search space</text><text x='12' y='50' class='p'>start: 39, 111, 5e-5</text><text x='12' y='72' class='p'>u1: 16..96; u2: 24..160</text><text x='12' y='94' class='p'>lr: 1e-5..3e-3 (log)</text><text x='12' y='114' class='p'>SA seed = 2026</text></g><line stroke='#34495e' stroke-width='2' marker-end='url(#a)' x1='200' y1='142' x2='235' y2='142'/>
<g transform='translate(240,80)'><rect fill='#fffaf3' stroke='#a46a1f' stroke-width='1.5' width='160' height='125' rx='9'/><text x='80' y='25' text-anchor='middle' class='h'>Neighbor proposal</text><text x='12' y='55' class='p'>architecture-space move</text><text x='12' y='78' class='p'>log-learning-rate move</text><text x='12' y='101' class='p'>clip to search bounds</text></g><line stroke='#34495e' stroke-width='2' marker-end='url(#a)' x1='400' y1='142' x2='435' y2='142'/>
<g transform='translate(440,80)'><rect fill='#fffaf3' stroke='#a46a1f' stroke-width='1.5' width='165' height='125' rx='9'/><text x='82' y='25' text-anchor='middle' class='h'>Evaluate proposal</text><text x='12' y='55' class='p'>train/validation only</text><text x='12' y='78' class='p'>objective: scaled val MSE</text><text x='12' y='101' class='p'>search patience = 4</text></g><line stroke='#34495e' stroke-width='2' marker-end='url(#a)' x1='605' y1='142' x2='640' y2='142'/>
<g transform='translate(645,65)'><rect fill='#fffaf3' stroke='#a46a1f' stroke-width='1.5' width='195' height='155' rx='9'/><text x='97' y='25' text-anchor='middle' class='h'>Accept / cool</text><text x='12' y='55' class='p'>always accept if score improves</text><text x='12' y='78' class='p'>else p = exp(-delta/effective_T)</text><text x='12' y='101' class='p'>T = max(0.05, 0.88^k)</text><text x='12' y='124' class='p'>budget = 16 evaluations</text></g><line stroke='#34495e' stroke-width='2' marker-end='url(#a)' x1='840' y1='142' x2='875' y2='142'/>
<g transform='translate(880,80)'><rect fill='#fffaf3' stroke='#a46a1f' stroke-width='1.5' width='175' height='125' rx='9'/><text x='87' y='25' text-anchor='middle' class='h'>Best validation HP</text><text x='12' y='55' class='p'>u1 = 47; u2 = 127</text><text x='12' y='78' class='p'>lr = 5.04788e-5</text><text x='12' y='101' class='p'>then fit/evaluate protocol</text></g><path d='M742,220 C742,285 320,285 320,205' fill='none' stroke='#34495e' stroke-width='2' marker-end='url(#a)'/><text x='540' y='305' text-anchor='middle' class='p'>Trial log: sa_search_trials.csv. Search never reads test predictions; best validation score does not prove test superiority.</text></svg>