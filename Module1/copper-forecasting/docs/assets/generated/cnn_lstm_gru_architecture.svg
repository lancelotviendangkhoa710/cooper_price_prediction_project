<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='290' viewBox='0 0 1000 290' role='img' aria-labelledby='t d'><title id='t'>CNN-LSTM and CNN-GRU architecture</title><desc id='d'>Architecture copied from build_net in V20 and V22 Non-SA.</desc><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#34495e'/></marker></defs><style>.title{font:600 20px sans-serif}.h{font:600 14px sans-serif}.p{font:12px sans-serif}.box{fill:#f8fbfd;stroke:#3f6680;stroke-width:1.5}.arrow{stroke:#34495e;stroke-width:2;marker-end:url(#a)}</style><rect width='100%' height='100%' fill='white'/><text x='500' y='30' text-anchor='middle' class='title'>Code-faithful CNN-LSTM / CNN-GRU (V20, V22 Non-SA)</text>
<g transform='translate(25,90)'><rect fill='#f8fbfd' stroke='#3f6680' stroke-width='1.5' width='125' height='90' rx='9'/><text x='62' y='27' text-anchor='middle' class='h'>Input</text><text x='62' y='50' text-anchor='middle' class='p'>(N, 22, F)</text></g><line stroke='#34495e' stroke-width='2' marker-end='url(#a)' x1='150' y1='135' x2='180' y2='135'/>
<g transform='translate(185,75)'><rect fill='#f8fbfd' stroke='#3f6680' stroke-width='1.5' width='150' height='120' rx='9'/><text x='75' y='25' text-anchor='middle' class='h'>Conv1D</text><text x='12' y='50' class='p'>filters=32, kernel=3</text><text x='12' y='70' class='p'>padding=causal</text><text x='12' y='90' class='p'>activation=ReLU</text><text x='12' y='108' class='p'>shape: (N,22,32)</text></g><line stroke='#34495e' stroke-width='2' marker-end='url(#a)' x1='335' y1='135' x2='365' y2='135'/>
<g transform='translate(370,90)'><rect fill='#f8fbfd' stroke='#3f6680' stroke-width='1.5' width='125' height='90' rx='9'/><text x='62' y='27' text-anchor='middle' class='h'>MaxPool1D</text><text x='62' y='50' text-anchor='middle' class='p'>pool=2</text><text x='62' y='70' text-anchor='middle' class='p'>(N,11,32)</text></g><line stroke='#34495e' stroke-width='2' marker-end='url(#a)' x1='495' y1='135' x2='525' y2='135'/>
<g transform='translate(530,75)'><rect fill='#f8fbfd' stroke='#3f6680' stroke-width='1.5' width='150' height='120' rx='9'/><text x='75' y='25' text-anchor='middle' class='h'>LSTM or GRU</text><text x='12' y='52' class='p'>48 units, sequences</text><text x='12' y='75' class='p'>24 units, final state</text><text x='12' y='98' class='p'>shape: (N,24)</text></g><line stroke='#34495e' stroke-width='2' marker-end='url(#a)' x1='680' y1='135' x2='710' y2='135'/>
<g transform='translate(715,90)'><rect fill='#f8fbfd' stroke='#3f6680' stroke-width='1.5' width='120' height='90' rx='9'/><text x='60' y='27' text-anchor='middle' class='h'>Dense 16</text><text x='60' y='52' text-anchor='middle' class='p'>ReLU</text><text x='60' y='72' text-anchor='middle' class='p'>(N,16)</text></g><line stroke='#34495e' stroke-width='2' marker-end='url(#a)' x1='835' y1='135' x2='865' y2='135'/>
<g transform='translate(870,90)'><rect fill='#f8fbfd' stroke='#3f6680' stroke-width='1.5' width='105' height='90' rx='9'/><text x='52' y='27' text-anchor='middle' class='h'>Dense 1</text><text x='52' y='52' text-anchor='middle' class='p'>linear</text><text x='52' y='72' text-anchor='middle' class='p'>(N,1)</text></g><text x='500' y='240' text-anchor='middle' class='p'>Compile: Adam(1e-3), MSE. Direct and residual variants use the same backbone; only the training target/reconstruction differs.</text><text x='500' y='262' text-anchor='middle' class='p'>Source: build_net, V20 cell 10 and V22 Non-SA cell 10.</text></svg>