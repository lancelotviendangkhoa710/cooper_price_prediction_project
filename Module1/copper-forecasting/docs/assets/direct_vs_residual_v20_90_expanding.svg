<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">V20 90/10 expanding — Direct versus Residual on FS02</title>
  <desc id="desc">Grouped bars compare MAE for Direct and Residual LSTM, GRU, CNN-LSTM and CNN-GRU. A dashed line marks Naive MAE 0.0771.</desc>
  <rect width="900" height="520" fill="white"/>
  <text x="450" y="30" text-anchor="middle" font-family="sans-serif" font-size="21">V20 90/10 expanding — Direct vs Residual (FS02)</text>
  <g stroke="#dddddd" stroke-width="1">
    <line x1="80" y1="430" x2="860" y2="430"/><line x1="80" y1="340" x2="860" y2="340"/>
    <line x1="80" y1="250" x2="860" y2="250"/><line x1="80" y1="160" x2="860" y2="160"/>
    <line x1="80" y1="70" x2="860" y2="70"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222" text-anchor="end">
    <text x="72" y="435">0.0</text><text x="72" y="345">0.3</text><text x="72" y="255">0.6</text>
    <text x="72" y="165">0.9</text><text x="72" y="75">1.2</text>
  </g>
  <line x1="80" y1="430" x2="860" y2="430" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="407" x2="860" y2="407" stroke="#111" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="855" y="399" text-anchor="end" font-family="sans-serif" font-size="12">Naive 0.0771</text>
  <g fill="#377eb8">
    <rect x="130" y="81" width="55" height="349"/><rect x="320" y="356" width="55" height="74"/>
    <rect x="510" y="97" width="55" height="333"/><rect x="700" y="341" width="55" height="89"/>
  </g>
  <g fill="#e6862a">
    <rect x="190" y="407" width="55" height="23"/><rect x="380" y="407" width="55" height="23"/>
    <rect x="570" y="407" width="55" height="23"/><rect x="760" y="407" width="55" height="23"/>
  </g>
  <g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222">
    <text x="157" y="74">1.1640</text><text x="217" y="401">0.0770</text>
    <text x="347" y="349">0.2479</text><text x="407" y="401">0.0771</text>
    <text x="537" y="90">1.1086</text><text x="597" y="401">0.0774</text>
    <text x="727" y="334">0.2964</text><text x="787" y="401">0.0781</text>
    <text x="187" y="457">LSTM</text><text x="377" y="457">GRU</text>
    <text x="567" y="457">CNN-LSTM</text><text x="757" y="457">CNN-GRU</text>
  </g>
  <text x="25" y="250" transform="rotate(-90 25 250)" text-anchor="middle" font-family="sans-serif" font-size="15">MAE (original price units)</text>
  <g font-family="sans-serif" font-size="13">
    <rect x="335" y="480" width="18" height="12" fill="#377eb8"/><text x="360" y="491">Direct</text>
    <rect x="440" y="480" width="18" height="12" fill="#e6862a"/><text x="465" y="491">Residual</text>
  </g>
</svg>
